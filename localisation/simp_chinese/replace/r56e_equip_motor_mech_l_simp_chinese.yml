l_simp_chinese:
  r56_combat_service: "战斗后勤支援"
  r56_combat_service_desc: "对我们军队的后勤方面的支持是在战场上取得成功的关键。"
  r56_convoy_highways: "高速公路 I"
  r56_convoy_highways_desc: "现代军队需要对他们使用的装备进行再补给。建设一种能够跟随部队并跟上部队后勤需求的持续补给的高速公路是至关重要的。"
  r56_convoy_highways_2: "高速公路 II"
  r56_convoy_highways_2_desc: "现代军队需要对他们使用的装备进行再补给。建设一种能够跟随部队并跟上部队后勤需求的持续补给的高速公路是至关重要的。"
  r56_convoy_highways_3: "高速公路 III"
  r56_convoy_highways_3_desc: "现代军队需要对他们使用的装备进行再补给。建设一种能够跟随部队并跟上部队后勤需求的持续补给的高速公路是至关重要的。"
  r56_convoy_highways_4: "高速公路 IV"
  r56_convoy_highways_4_desc: "现代军队需要对他们使用的装备进行再补给。建设一种能够跟随部队并跟上部队后勤需求的持续补给的高速公路是至关重要的。"
  r56_flexible_railnetwork: "灵活的铁路网络"
  r56_flexible_railnetwork_desc: "专门运输一种货物的铁路网络能够减少运输成本，适合私营公司提升利润，但在运输军事物资时，这种网络就显得很薄弱。为了国家安全，我们需要铁路网络的灵活性。"
  r56_military_railnetwork: "军事铁路网"
  r56_military_railnetwork_desc: "专为军事用途建造的铁路，建造和设计成本更低，更符合军队的独特需求的铁路"
  r56_modern_military_railnetwork: "改进的军事铁路网"
  r56_modern_military_railnetwork_desc: "军事铁路的研究使我们提高了对军队的后勤支持水平。"