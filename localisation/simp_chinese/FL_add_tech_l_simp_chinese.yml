l_simp_chinese:
  FL_coldwar_military_railnetwork_1: "冷战早期军事铁路网"
  FL_coldwar_military_railnetwork_1_desc: "在冷战早期，军事铁路网成为战略物资和兵力机动的核心保障。它不仅能在极短时间内将部队投送至边境，还能为核武器部署和防御工事建设提供持续补给。在这一时期，铁路的可靠性与覆盖范围直接关系到国家的战略安全。"
  FL_coldwar_military_railnetwork_2: "冷战中期军事铁路网"
  FL_coldwar_military_railnetwork_2_desc: "随着冷战局势加剧，中期的军事铁路网强调多方向、快速反应能力。新建和改造的线路使部队可在数小时内转移数百公里，同时支持重型坦克和导弹发射系统的运输。铁路枢纽成为战时指挥与调度的关键节点。"
  FL_coldwar_military_railnetwork_3: "冷战晚期军事铁路网"
  FL_coldwar_military_railnetwork_3_desc: "在冷战晚期，铁路网的战略角色扩展至跨国联动与深远纵深作战支援。专用军用列车可在战区与后方之间快速循环运送补给，并能在核冲击或空袭后迅速恢复运行。铁路网络的韧性成为维系战争潜力的决定性因素。"
  FL_coldwar_military_railnetwork_4: "冷战末期军事铁路网"
  FL_coldwar_military_railnetwork_4_desc: "冷战末期的军事铁路网进入高度自动化与防护化阶段。卫星导航、远程调度和隐蔽掩体式车站的应用，使铁路运输在面对现代精确打击时依旧保持高效与安全。铁路成为一条隐形的战略生命线，贯穿整个国家防御体系。"