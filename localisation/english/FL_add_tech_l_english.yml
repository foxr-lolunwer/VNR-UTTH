l_english:
  FL_coldwar_military_railnetwork_1: "Early Cold War Military Rail Network"
  FL_coldwar_military_railnetwork_1_desc: "In the early Cold War, the military railway network became the backbone of strategic logistics and troop mobility. It enabled rapid deployment of forces to the borders and provided continuous supply for nuclear weapon deployment and fortification construction. At this stage, the reliability and reach of the rail network directly determined national strategic security."
  FL_coldwar_military_railnetwork_2: "Mid Cold War Military Rail Network"
  FL_coldwar_military_railnetwork_2_desc: "As Cold War tensions escalated, the mid-period military railway network focused on multidirectional and rapid response capabilities. Newly built and upgraded lines allowed forces to move hundreds of kilometers within hours, while supporting the transport of heavy tanks and missile launch systems. Railway hubs became critical command and coordination points during wartime."
  FL_coldwar_military_railnetwork_3: "Late Cold War Military Rail Network"
  FL_coldwar_military_railnetwork_3_desc: "In the late Cold War, the strategic role of the railway network expanded to include multinational coordination and deep operational support. Specialized military trains could cycle supplies rapidly between the front and the rear, and were designed to resume operation quickly after nuclear strikes or air raids. The resilience of the rail network became a decisive factor in sustaining war potential."
  FL_coldwar_military_railnetwork_4: "Final Cold War Military Rail Network"
  FL_coldwar_military_railnetwork_4_desc: "By the final stage of the Cold War, the military railway network had reached a highly automated and fortified state. With satellite navigation, remote scheduling, and concealed bunker-style stations, railway transport remained efficient and secure even against modern precision strikes. The rail system became an invisible strategic lifeline running through the entire national defense structure."