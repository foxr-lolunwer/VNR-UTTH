#### EX TECH
  VUCE_coldwar_damage_control_1: "Early Cold War Damage Control"
  VUCE_coldwar_damage_control_1_desc: "Learning the painful lessons of massive naval engagements during World War II, we have begun to standardize damage control procedures and equip crews with more efficient portable fire extinguishers and breathing apparatuses."
  VUCE_coldwar_damage_control_2: "Early-Mid Cold War Damage Control"
  VUCE_coldwar_damage_control_2_desc: "With the advent of anti-ship missiles, passive defense is no longer sufficient. By introducing automated induction watertight doors and centralized deck sprinkling systems, the survivability of warships after being hit has been significantly improved."
  VUCE_coldwar_damage_control_3: "Mid-Late Cold War Damage Control"
  VUCE_coldwar_damage_control_3_desc: "The application of electronic monitoring systems allows the bridge to track damage in each compartment in real-time. Meanwhile, specialized chemical extinguishing agents and reinforced hull patching kits have become standard issue."
  VUCE_coldwar_damage_control_4: "Late Cold War Damage Control"
  VUCE_coldwar_damage_control_4_desc: "The integration of NBC (Nuclear, Biological, Chemical) filtration systems allows warships to continue operations in extreme environments. Damage Control Centers now possess independent redundant power supplies, ensuring repair work never ceases."
  VUCE_coldwar_damage_control_5: "End of Cold War Damage Control"
  VUCE_coldwar_damage_control_5_desc: "A highly automated damage control architecture can automatically isolate damaged zones and reroute critical power systems."
  VUCE_coldwar_fire_control_methods_1: "Cold War Gunnery Drills I"
  VUCE_coldwar_fire_control_methods_1_desc: "Combining traditional missile launch experience with early analog computers, these drills aim to shorten the time from rangefinding to launch through higher frequency live-fire simulations."
  VUCE_coldwar_fire_control_methods_2: "Cold War Gunnery Drills II"
  VUCE_coldwar_fire_control_methods_2_desc: "As radar technology becomes ubiquitous, we are training fire control officers to rely on instruments rather than the naked eye. All-weather fire control has become the new norm for naval tactics."
  VUCE_coldwar_fire_control_methods_3: "Cold War Gunnery Drills III"
  VUCE_coldwar_fire_control_methods_3_desc: "The introduction of digital fire control systems enables the simultaneous handling of multiple air and surface targets. Through cross-ship data sharing, the firepower of the entire fleet operates as a single entity."
  VUCE_coldwar_fire_control_methods_4: "Cold War Gunnery Drills IV"
  VUCE_coldwar_fire_control_methods_4_desc: "Entering the era of information warfare. Using satellite data links and advanced algorithms, our strike precision has surpassed the limitations of the old navy, achieving 'detection is destruction'."
  VUCE_coldwar_landing_craft_1: "Joint Landing Operations"
  VUCE_coldwar_landing_craft_1_desc: "Traditional beach landings have evolved into multi-branch, multi-dimensional joint operations. By coordinating sea-air fire suppression and transport scheduling, we ensure the rapid consolidation of beachheads."
  VUCE_coldwar_landing_craft_2: "Amphibious Assault Ship"
  VUCE_coldwar_landing_craft_2_desc: "WWII-era improvised landing vessels are no longer sufficient. Early Amphibious Assault Ships introduce integrated deployment, combining troops, vehicles, and landing craft on a single platform. Despite limited aviation and defenses, they replace converted ships and enable modern large-scale amphibious operations."
  VUCE_coldwar_landing_craft_3: "Assault Hovercraft"
  VUCE_coldwar_landing_craft_3_desc: "Speed is the key to breaking coastal defenses. Assault hovercraft can skim over minefields and shallows at speeds exceeding 50 knots to deliver heavy equipment directly inland, rendering the enemy's coastal fortifications obsolete."

  VUCE_coldwar_ff_role: "Frigate Role"
  VUCE_coldwar_ff_role_desc: "Frigate Role"
  VUCE_ship_helipad_1950: "1950 Shipborne Helicopter"
  VUCE_ship_helipad_1950_desc: "At the end of World War II and the early Cold War, helicopters began experimental use by fleets, primarily performing reconnaissance and rescue missions. Although range and payload were limited, they marked the first time surface ships possessed vertical takeoff and landing capabilities."
  VUCE_ship_helipad_1960: "1960 Shipborne Helicopter"
  VUCE_ship_helipad_1960_desc: "As the anti-submarine threat intensified, helicopters began to be equipped with ASW sensors and torpedoes, becoming an important anti-submarine asset for escort fleets. During this stage, carrier-based helicopters were still predominantly medium and small-sized, suitable for deployment on destroyer and cruiser platforms."
  VUCE_ship_helipad_1970: "1970 Shipborne Helicopter"
  VUCE_ship_helipad_1970_desc: "Helicopter platforms became increasingly mature, capable of performing multiple missions, including anti-submarine warfare, transport, and battlefield reconnaissance. Fleet tactics began integrating helicopters with surface ships for combined operations, providing crucial support to carriers and escort groups."
  VUCE_ship_helipad_1980: "1980 Shipborne Helicopter"
  VUCE_ship_helipad_1980_desc: "Large anti-submarine helicopters were deployed on cruisers, destroyers, and light carriers, equipped with more advanced radar, sonobuoys, and weapon systems, enabling them to conduct sustained operations in waters far from their home ports."
  VUCE_ship_helipad_1990: "1990 Shipborne Helicopter"
  VUCE_ship_helipad_1990_desc: "By the late Cold War, carrier-based helicopters had become highly specialized, featuring all-weather anti-submarine capabilities, multi-role coordinated operations, and integration with carriers, escort ships, and carrier-based AEW via data links, enabling fleets to operate efficiently in complex combat environments."

  VUCE_continue_battleship_design: "Continue Battleship Design"
  VUCE_continue_battleship_design_desc: "Although the development of aviation and missile technology has shaken the naval supremacy of the battleship, its heavy armor and large-caliber guns still provide unmatched psychological deterrence and firepower projection. For a variety of reasons, the navy has decided to continue battleship development, seeking a new role for this venerable class in the modern era."
  VUCE_new_main_battery_design: "New Main Battery Design"
  VUCE_new_main_battery_design_desc: "Through improvements in barrel materials, propellant configurations, and fire control systems, the new generation of main guns achieves enhanced range, accuracy, and rate of fire. Although missiles are becoming the dominant long-range strike method, modern naval artillery remains irreplaceable in shore bombardment and sustained fire support roles."
  VUCE_new_armor_design: "New Armor Design"
  VUCE_new_armor_design_desc: "In the face of shaped charges and missile warheads, traditional homogeneous armor can no longer provide sufficient protection. The introduction of composite and layered armor significantly improves resistance to damage, allowing large hulls to retain a degree of survivability in high-intensity combat environments."
  VUCE_ship_hull_heavy_5: "Guided Missile Battleship Hull"
  VUCE_ship_hull_heavy_5_desc: "This design represents an attempt to integrate guided weapons into the traditional battleship platform. By combining heavy armor and large displacement with early missile systems, the vessel gains beyond-visual-range strike capability."
  VUCE_ship_hull_heavy_6: "Arsenal Ship Hull"
  VUCE_ship_hull_heavy_6_desc: "The arsenal ship concept abandons the traditional gun-centric battleship design in favor of massive vertical launch systems. Such vessels can carry large numbers of cruise missiles, enabling long-range precision strikes against both land and naval targets."
