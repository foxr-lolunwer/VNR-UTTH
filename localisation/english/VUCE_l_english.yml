#### EX UNIT
  VUCE_coldwar_carrier: "Cold War Carrier"
  VUCE_coldwar_carrier_desc: "§HCold War Carrier§!\n\n\n\n\n\n£GFX_VUCE_carrier_desc_icon \n\n\n\n\n\nDeveloped from World War II carrier technology, Cold War carriers became the core of modern fleets, typically equipped with jet aircraft, early warning planes, and anti-submarine helicopters. They undertook long-range strikes, air superiority missions, fleet air defense, and anti-submarine warfare, symbolizing naval power projection. During the Cold War, carriers became key instruments in the US-Soviet naval strategic rivalry."
  VUCE_frigate: "Cold War Frigate"
  VUCE_frigate_desc: "§HCold War Frigate§!\n\n\n\n\n\n£GFX_VUCE_frigate_desc_icon \n\n\n\n\n\nThe Cold War frigate is a class of versatile light combat vessels that gradually replaced many roles once performed by WWII destroyers, including anti-submarine warfare, convoy escort, and maritime patrol. During the Cold War, these ships were equipped with modern sonar, missiles, and naval guns, allowing them to operate effectively in distant waters. They served as a crucial force for fleet protection and maintaining control over peripheral maritime zones."
  VUCE_destroyer: "Cold War Destroyer"
  VUCE_destroyer_desc: "§HCold War Destroyer§!\n\n\n\n\n\n \n\n\n\n\n\n"
  VUCE_guided_missile_battleship: "Guided Missile Battleship"
  VUCE_guided_missile_battleship_desc: "§HGuided Missile Battleship§!\n\n\n\n\n\n£GFX_VUCE_gm_battleship_desc_icon \n\n\n\n\n\nThe guided missile battleship is a long-range strike platform converted from traditional battleships. As battleships gradually faded from the naval stage, some argued that outright retirement was the logical choice, while others believed simply retiring them was a waste. Consequently, some battleships were converted into arsenal ships – their retained large-caliber guns provided inexpensive shore bombardment, while added missile systems enabled precise strikes against surface and strategic land targets, as well as air defense and fire support. However, whether such conversions were truly worthwhile remained controversial: high maintenance costs and the sheer power of guided missiles cast doubt on their ability to play a decisive role in modern naval warfare."
  VUCE_guided_missile_cruiser: "Guided Missile Cruiser"
  VUCE_guided_missile_cruiser_desc: "§HGuided Missile Cruiser§!\n\n\n\n\n\n£GFX_VUCE_gm_cruiser_desc_icon \n\n\n\n\n\nThe guided missile cruiser is a medium to large combat vessel equipped with both anti-ship and surface-to-air missiles, combining offensive, defensive, and command capabilities. During the Cold War, these ships often served as key escorts within carrier battle groups or as independent strike units, capable of delivering effective attacks against enemy fleets and aerial threats."
  VUCE_guided_missile_destroyer: "Guided Missile Destroyer"
  VUCE_guided_missile_destroyer_desc: "§HGuided Missile Destroyer§!\n\n\n\n\n\n£GFX_VUCE_gm_destroyer_desc_icon \n\n\n\n\n\nThe guided missile destroyer is a fast, agile medium-small warship equipped with modern missile systems and anti-submarine weapons, optimized for escort, anti-submarine, and air defense missions. They were the front-line force of Cold War naval task groups, capable of providing effective deterrence and strikes against submarines and hostile surface ships in open-ocean operations."
  VUCE_guided_missile_frigate: "Guided Missile Frigate"
  VUCE_guided_missile_frigate_desc: "§HGuided Missile Frigate§!\n\n\n\n\n\n \n\n\n\n\n\n"
  VUCE_missile_submarine: "Missile Submarine"
  VUCE_missile_submarine_desc: "§HMissile Submarine§!\n\n\n\n\n\n£GFX_VUCE_missile_sub_desc_icon \n\n\n\n\n\nThe missile submarine is a covert long-range strike platform capable of carrying anti-ship or ballistic missiles to deliver surprise attacks against surface or strategic targets. During the Cold War, missile submarines became a key component of nuclear deterrence and maritime strategic projection. Their stealth and long-range strike capabilities made them one of the most vital strategic assets of the modern navy."
  VUCE_lha: "Amphibious Assault Ship"
  VUCE_lha_desc: "Improvised WWII-era transport ships and landing craft could no longer meet the demands of modern warfare. The first generation of purpose-built amphibious assault ships marked a turning point in naval landing operations from 'ad-hoc' to 'systematic'. By incorporating well decks, vehicle decks, and basic command facilities, these ships enabled troops, armored vehicles, and landing craft to be concentrated and deployed from a single platform, coordinating landings in coastal conditions. Although their aviation and protection remained limited, the advent of amphibious assault ships meant large-scale cross-sea landings no longer depended on converted vessels, laying the foundation for more three-dimensional, long-range amphibious warfare."
#### EX EQUIPMENT
  VUCE_ship_hull_lha_1: "Amphibious Assault Ship Hull"
  VUCE_ship_hull_lha_1_desc: "Improvised transports and landing craft from World War II are no longer adequate for modern warfare. The first generation of purpose-built Amphibious Assault Ships marks a shift from makeshift solutions to integrated systems. With well decks, vehicle storage, and basic command facilities, they enable coordinated deployment of troops, vehicles, and landing craft from a single platform. Though limited in aviation and defense, they end reliance on converted vessels and lay the groundwork for future large-scale amphibious operations."
