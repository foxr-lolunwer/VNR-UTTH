#### UI
  VUCE_navy_rework_welcome_splash_tab_5: "VUC Patch"
  VUCE_MOD_VER_CONTENT: "UTTNH+VNR Compatibility Pack Version: Neo 1.8.4\n"
  VUCE_XNR_VER_CONTENT: "Vanilla Naval Rework Version: v2.11 \"Tokyo Bay Finale\" (UTC+8 2026.6.22)\n"
  VUCE_TECHMOD_VER_CONTENT: "UTTNH Version: UTC+8 2026.1.11\n"
  VUCE_SUPPORT_TEXT_CONTENT: "Supported:\n"
  VUCE_LINE_TEXT_CONTENT: "§Y------§!\n"
  VUCE_TUTORIAL_CONTENT: "You may experience numerical imbalances when playing the Cold War content provided by VUCE\n\nThe VNR+UTTNH Extended Content (VUCE) introduces many changes to the game that differ from VNR, hence this tab is designed to give you a quick overview.\n\n§YBattleship Offense and Defense§!\nCold War content stats in VUCE are quite unique compared to Vanilla/VNR:\nLight attack in Vanilla is treated in VUCE as all non-missile/torpedo attacks. Accordingly, Heavy attack in VUCE is treated as missile attacks;\nAt the same time, missile-class ships gain significant armor bonuses, making them nearly impossible for gun-based ships to penetrate, dealing only minimal damage.\nMissile-class ships, equipped with anti-ship missiles, have terrifying damage and penetration, whether against their own class or old-era ships.\n\n§YAmphibious Assault Ships§!\nAmphibious assault ships have terrifying light attack, meaning they provide extremely valuable bonuses during shore bombardment;\nVUCE increases the maximum shore bombardment bonus to 80%, a change made specifically for these ships;\nBut note, amphibious assault ships have 0 light piercing, dealing only 1% damage to other warships.\n\n§YCold War Carriers§!\nCold War-era carriers designed by VUCE have terrifying stats, with HP and organization reaching up to 1000+, making them very difficult to sink even for missile ships. Of course, their cost, often exceeding 30,000, is daunting.\nSince there is no concept of aircraft size in Hearts of Iron IV, carrier deck capacity inevitably grows larger (even if the carrier only carries strategic bombers). This is a necessary compromise.\nOtherwise, late-WWII carriers with 100+ capacity would remain the most cost-effective choice. As it stands, late-WWII carriers are still the most economical option. Building extremely expensive, low-value Cold War supercarriers is up to you.\n\n§YCold War Missile Ships§!\nFrigates, destroyers, cruisers, and even battleships have their missile variants;\nFrigates can only equip light anti-ship missiles. Late-game destroyers can equip heavy missiles. Cruisers and battleships can always equip all missile types.\n\n§YNew Production Interface§!\nThe widened ship production interface was added by VUCE because the vanilla production interface had display issues when accommodating more than 12 ship types, so I directly took SCW's ship production interface.\n\n§RCold War Missile Ships/Submarines and much other content are still far from complete§!\nAll I can say is that I have limited energy, and Hearts of Iron IV is no longer as appealing to me as it once was. I cannot consistently invest time here. Even keeping the mod up-to-date is difficult now; I see bug reports and update requests within 24 hours, but I really don't want to launch a game I haven't opened in weeks just because of that.\nMaking a compatibility mod like this is very tiring. You can think of it as the difference between a manager and an employee: The manager (the mod author being patched) can update content relatively freely because as long as our common boss (Paradox) doesn't have a major update, they don't need to worry about their mod breaking. But whenever VNR or UTTNH makes a small update, this compatibility mod must be updated – something I dislike.\nI will still maintain this mod, but I cannot guarantee the speed of updates for compatibility.\n\nSCW was a full-架空 world mod I was working on, but I've stopped development and never released it. The new ship icons are inherited from SCW's assets/style.\n\n§RThis tab was added by the compatibility pack and has nothing to do with VNR itself. Any mention of \"I\" refers to the compatibility pack author.§!\n"
  VUCE_navy_rework_welcome_splash_tab_5_content: "§H$VUCE_MOD_VER_CONTENT$§!$VUCE_SUPPORT_TEXT_CONTENT$$VUCE_XNR_VER_CONTENT$$VUCE_TECHMOD_VER_CONTENT$$VUCE_LINE_TEXT_CONTENT$\n$VUCE_TUTORIAL_CONTENT$"
